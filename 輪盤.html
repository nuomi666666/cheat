<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, user-scalable=0, initial-scale=1, viewport-fit=cover" />
<title>隨機抽籤輪盤</title>

<!-- 直接引入原網站的 CSS，確保字體、配色與排版 100% 相同 -->
<link rel="stylesheet" type="text/css" href="https://assets.piliapp.com/v3/3dnt2_3d9e0.css" crossorigin/>

<style>
    body {
        background-color: #fdfdfd;
        overflow-x: hidden;
    }

    /* 將輪盤置中，模擬全螢幕效果 */
    .wheel-container {
        position: relative;
        width: 480px;
        height: 480px;
        margin: 30px auto;
    }

    /* 隱藏原生多餘的區塊與側邊欄 */
    #adsbar, #bottom-ads, #sidebar, #desc, .footer {
        display: none !important;
    }

    canvas {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1);
        cursor: pointer;
    }

    /* 右側紅色指針 */
    .pointer {
        position: absolute;
        right: -25px;
        top: 50%;
        transform: translateY(-50%);
        width: 0;
        height: 0;
        border-top: 15px solid transparent;
        border-bottom: 15px solid transparent;
        border-right: 30px solid #dc3545;
        z-index: 15;
    }

    /* 標題與結果彈出視窗容器 */
    .title-wrapper {
        position: relative;
        text-align: center;
        margin-top: 35px;
        height: 50px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .title-wrapper h1 {
        font-size: 36px;
        font-weight: normal;
        color: #212529;
        margin: 0;
    }

    /* 彈出視窗：設定為絕對定位並填滿父層高度以完全遮擋標題 */
    #result-popup {
        position: absolute;
        background-color: #fce8b3;
        width: 450px;
        height: 55px; /* 稍微大於標題字體以確保完全覆蓋 */
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 15px;
        border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        z-index: 20;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
    }

    #result-popup.show {
        opacity: 1;
        pointer-events: auto;
    }

    #result-text {
        font-size: 24px;
        font-weight: bold;
        color: #333;
    }

    .popup-btn {
        background: white;
        border: 1px solid #aaa;
        color: #333;
        padding: 2px 10px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 3px;
    }

    .popup-btn:hover {
        background: #eee;
    }
</style>
</head>
<body>

<!-- 100% 還原的頂部黑框導覽列 -->
<div class="container-fluid px-0">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" aria-label="breadcrumb">
        <div class="collapse navbar-collapse px-3">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item active"><a class="nav-link active" href="#">輪盤</a></li>
                <li class="nav-item"><a class="nav-link" href="#">骰子</a></li>
                <li class="nav-item"><a class="nav-link" href="#">隨機數字</a></li>
                <li class="nav-item"><a class="nav-link" href="#">硬幣</a></li>
                <li class="nav-item"><a class="nav-link" href="#">隨機排序</a></li>
                <li class="nav-item"><a class="nav-link" href="#">抽籤</a></li>
                <li class="nav-item"><a class="nav-link" href="#">計時器</a></li>
                <li class="nav-item"><a class="nav-link" href="#">時鐘</a></li>
                <li class="nav-item"><a class="nav-link" href="#">計分板</a></li>
                <li class="nav-item"><a class="nav-link" href="#">擲筊</a></li>
            </ul>
        </div>
    </nav>
</div>

<!-- 標題與遮擋用的彈窗 -->
<div class="title-wrapper">
    <h1>隨機抽籤輪盤</h1>
    <div id="result-popup">
        <button class="popup-btn" id="close-btn">x</button>
        <span id="result-text"></span>
        <button class="popup-btn" id="hide-btn">s</button>
    </div>
</div>

<!-- 輪盤主體 -->
<div class="wheel-container">
    <div class="pointer"></div>
    <canvas id="wheelCanvas" width="800" height="800" title="點擊旋轉"></canvas>
</div>

<script>
    /* ==========================================
       【暗箱操作設定區】
       ========================================== */
    // 依序必定抽中的數字
    const riggedSequence = [53, 27, 8]; 
    let riggedIndex = 0; 

    /* ==========================================
       輪盤基本設定
       ========================================== */
    // 自動生成 1 到 53
    let items = Array.from({length: 53}, (_, i) => (i + 1).toString());
    
    // 預設粉彩色系
    const colors = ['#4285F4', '#F47B6B', '#90EE90', '#F5DEB3', '#DDA0DD', '#F5DEB3'];

    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    const resultPopup = document.getElementById("result-popup");
    const resultText = document.getElementById("result-text");
    const hideBtn = document.getElementById("hide-btn");
    const closeBtn = document.getElementById("close-btn");

    let currentRotation = 0;
    let isSpinning = false;
    let selectedItem = null;

    function drawWheel() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (items.length === 0) return;

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = centerX;
        const sliceAngle = (2 * Math.PI) / items.length;

        for (let i = 0; i < items.length; i++) {
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, i * sliceAngle, (i + 1) * sliceAngle);
            ctx.closePath();
            ctx.fillStyle = colors[i % colors.length];
            ctx.fill();
            
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#999";
            ctx.stroke();

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(i * sliceAngle + sliceAngle / 2);
            ctx.textAlign = "right";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "black";
            
            // 畫布內部尺寸放大到 800x800 以保持清晰度，字體等比例設定
            ctx.font = "18px Arial"; 
            ctx.fillText(items[i], radius - 20, 0);
            ctx.restore();
        }
    }

    drawWheel();

    // 點擊畫布觸發旋轉
    canvas.addEventListener("click", () => {
        if (isSpinning || items.length === 0) return;
        isSpinning = true;
        resultPopup.classList.remove("show");

        let targetItem;
        
        if (riggedIndex < riggedSequence.length && items.includes(riggedSequence[riggedIndex].toString())) {
            targetItem = riggedSequence[riggedIndex].toString();
            riggedIndex++;
        } else {
            targetItem = items[Math.floor(Math.random() * items.length)];
            if (riggedIndex < riggedSequence.length) riggedIndex++; 
        }

        selectedItem = targetItem;
        const targetIndex = items.indexOf(targetItem);
        const sliceAngle = 360 / items.length;

        // 計算讓目標對準右側指針的角度
        const offsetAngle = targetIndex * sliceAngle + sliceAngle / 2;
        const stopAngle = 360 - offsetAngle;

        // 預設轉 5 圈
        const spins = 5 * 360;
        const finalRotation = currentRotation + spins + stopAngle - (currentRotation % 360);

        canvas.style.transform = `rotate(${finalRotation}deg)`;
        currentRotation = finalRotation;

        setTimeout(() => {
            isSpinning = false;
            showResult(selectedItem);
        }, 4000);
    });

    function showResult(item) {
        resultText.textContent = item;
        resultPopup.classList.add("show");
    }

    closeBtn.addEventListener("click", () => {
        resultPopup.classList.remove("show");
    });

    hideBtn.addEventListener("click", () => {
        resultText.textContent = `${selectedItem} 已被隱藏`;
        
        setTimeout(() => {
            items = items.filter(i => i !== selectedItem);
            resultPopup.classList.remove("show");

            canvas.style.transition = 'none';
            canvas.style.transform = `rotate(0deg)`;
            currentRotation = 0;
            
            drawWheel();

            setTimeout(() => {
                canvas.style.transition = 'transform 4s cubic-bezier(0.1, 0.7, 0.1, 1)';
            }, 50);

        }, 800); 
    });
</script>
</body>
</html>
