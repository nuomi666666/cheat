<!DOCTYPE html>
<html lang="zh-Hant" class="cjk " dir="">
<head>

<!-- 載入官方 CSS，確保基礎視覺一致 -->
<link rel="stylesheet" type="text/css" href="https://assets.piliapp.com/v3/3dnt2_3d9e0.css" crossorigin/>
<style>
.bi-home { background:url(https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.6.1/icons/house-door-fill.svg); }
.bi-x { background:url(https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.6.1/icons/x-circle-fill.svg); }

/* 轉盤本體 */
#wheel { width: 100%; height: auto; transform-origin: center center; display: block; }
#wheel-pin {
    position: absolute; right: -15px; top: 50%; transform: translateY(-50%);
    width: 0; height: 0; border-top: 15px solid transparent;
    border-bottom: 15px solid transparent; border-right: 25px solid #e53e3e;
    z-index: 10;
}
#pls-click {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(60, 60, 60, 0.85); color: white; padding: 12px 60px;
    border-radius: 30px; font-size: 1.5rem; z-index: 15; pointer-events: none;
}

/* 針對右側清單的刪除線樣式 */
.names div.strike {
    text-decoration: line-through;
    color: #a0a0a0;
}

/* 假廣告樣式 */
.fake-ad { background-color: #2b3137; color: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; position: relative;}
.fake-ad h3 { font-size: 1.5rem; font-weight: bold; }
.fake-ad p { font-size: 0.8rem; color: #ccc; margin-top: 10px;}
.fake-ad-2 { background-color: #e6f2f5; color: #333; border-radius: 8px; padding: 20px; }
.fake-ad-2 h3 { font-size: 1.4rem; font-weight: bold; }

/* 修正橫幅按鈕對齊：X 在左，S 在右，完美貼合原版 */
#banner button {
    position: absolute; top: 50%; transform: translateY(-50%);
    border: none; background: white; color: black;
    font-size: 1rem; font-weight: bold; border-radius: 3px;
    padding: 2px 10px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.2);
}
#hide-result { right: 10px; } /* S 按鈕固定在右邊 */
#close-banner { left: 10px; } /* X 按鈕固定在左邊 */
</style>

<title>隨機抽籤輪盤</title>
<link rel="shortcut icon" href="https://assets.piliapp.com/s3pxy/random/wheel/favicon.ico" />
</head>
<body>
<div class="container">
    <div class="row no-gutters"><div class="col-12 g-0">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark" aria-label="breadcrumb">
    <a class="navbar-brand d-none d-lg-inline-block" href="#"><i class="bi-home"></i>
		<span id="piliapp-home-text">首頁</span>
    </a>
<button class="navbar-toggler" type="button" aria-expanded="false" aria-label="Toggle navigation">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="navbar">
        <ul class="navbar-nav mr-auto">
<li class="nav-item active"><a class="nav-link active" href="#">輪盤</a></li>
<li class="nav-item"><a class="nav-link" href="#">骰子</a></li>
<li class="nav-item"><a class="nav-link" href="#">隨機數字</a></li>
<li class="nav-item"><a class="nav-link" href="#">硬幣</a></li>
<li class="nav-item"><a class="nav-link" href="#">隨機排序</a></li>
<li class="nav-item"><a class="nav-link" href="#">抽籤</a></li>
<li class="nav-item"><a class="nav-link" href="#">計時器</a></li>
<li class="nav-item"><a class="nav-link" href="#">時鐘</a></li>
<li class="nav-item"><a class="nav-link" href="#">計分板</a></li>
<li class="nav-item"><a class="nav-link" href="#">擲筊</a></li>

		<span id="screen-btn" class="btn btn-sm btn-outline float-right navbar-text d-none">
			全螢幕 <u></u> <i class="bi-x"></i>

    </div>
        <a id="live-btn" class="live-btn navbar-text btn btn-sm btn-outline float-right fs-hide" href="#"><i></i>直播</a>
</nav>

</div>

<div class="container">
<div class="row no-gutters">
<div id="adsbar" class="col-12 col-xl-3">
    <!-- 左側假廣告 -->
    <div style="margin-top: 30px;">
        <div style="text-align:right; font-size: 0.7rem; color: #999;">ⓘ 中華工商研究院</div>
        <div class="fake-ad">
            <h3>主管訓練專業課<br>程-<br>進修最佳選擇</h3>
            <p>管理核心能力及營運戰略培訓，傳授各種工具方法及要訣，內容豐富多元，快速提升職場專業與團隊戰力</p>
            <div style="position: absolute; right: 20px; bottom: 20px; width: 35px; height: 35px; background: white; color: black; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem;">></div>
        </div>
        <div class="fake-ad-2">
            <h3>展現內在創意</h3>
            <button style="background: #007bff; color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; border:none; margin-top:10px; font-weight:bold;">立即試用</button>
            <div style="margin-top:30px; font-weight:bold; color:red; font-size:1.2rem;">Adobe<br><span style="color:#333; font-size:0.9rem;">Creative Cloud</span></div>
        </div>
    </div>
</div>
</div>
 
<div id="piliapp" class="row">
    <div class="col-12"><div class="row">
    <div id="header" class="col-12 text-center pt-3 pb-3 col-xl-6 offset-xl-3">
        <h1 id="main-title">隨機抽籤輪盤</h1>
        <!-- 開獎方框 (Banner) 加上相對定位以利內部按鈕絕對定位 -->
        <div class="h1" id="banner" style="display:none; position:relative;">
            <button id="close-banner">X</button>
            <span id="banner-text">_</span>
            <button id="hide-result" title="隱藏選取的項目">S</button>
        </div>
    </div>
    
    <div class="d-none align-items-center col-xl-3 d-xl-flex">
        <div class="mx-auto">
            <input type="button" class="spin-btn btn btn-primary btn-lg" value="開始" />
            <input type="button" class="reset-btn btn btn-danger btn-sm" value="重設" title="顯示所有隱藏項目" />
        </div>
    </div>
    </div></div>

    <div class="col-12"><div class="row">
    <div class="col-12 col-xl-6 offset-xl-3" id="results">
        <div id="wheel-wrapper">
            <div id="pls-click">按一下以旋轉</div>
            <canvas id="wheel" width="600" height="600"></canvas>
            <span id="wheel-center" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 30px; height: 30px; background: white; border-radius: 50%; z-index: 5; box-shadow: 0 0 5px rgba(0,0,0,0.4);"></span>
            <span id="wheel-pin"></span>
        </div>

        <div class="d-block d-lg-none controls text-center mt-3">
            <div>
                <input type="button" class="spin-btn btn btn-primary btn-lg" value="開始" />
                <input type="button" class="reset-btn btn btn-danger btn-sm" value="重設" title="顯示所有隱藏項目" />
            </div>
        </div>
    </div>

    <div class="col-12 mt-3 mt-xl-0 flex-column col-xl-3 d-flex" id="sidebar">
        <!-- 右側數字清單 -->
        <div id="names-show" class="names" style="overflow-y: auto; height: 380px; text-align: left; background: white; padding: 10px; border: 1px solid #ccc; line-height: 1.2;"></div>
        
        <div id="edit-bar" style="visibility: visible; margin-top: 5px;">
            <button class="btn btn-outline-secondary btn-sm float-left">標題</button>
            <button class="btn btn-outline-secondary btn-sm float-right">編輯</button>
            <button class="btn btn-outline-secondary btn-sm float-right">隱藏...</button>
        </div>
        <div class="d-none d-xl-block">
        <div id="shortcut">
            <div> <span class="key">SPACE</span> 旋轉 </div>
            <div> <span class="key">X</span> 關閉橫幅 </div>
            <div> <span class="key">S</span> 隱藏選取的項目 </div>
            <div> <span class="key">R</span> 重設 </div>
            <div> <span class="key">E</span> 編輯 </div>
            <div id="fullscreen-shortcut"> <span class="key">F</span> 全螢幕 </div>
        </div>
        </div>
    </div>
    </div></div>
<div class="col-12 text-center clearfix"></div>
    </div>
</div>

<script>
(function() {
    // 1. 設定完整的預定開獎順序 (1~54)
    const riggedSequence = [
        "31", "19", "1", "28", "15", "48", "38", "35", "52", "2", "46", "36", "47", "37", "32", "21", 
        "22", "44", "13", "40", "30", "24", "10", "34", "9", "3", "39", "25", "16", "27", "5", 
        "42", "29", "4", "18", "54", "51", "41", "43", "50", "23", "6", "11", "12", "17", "49", 
        "53", "8", "14", "33", "20", "7", "26", "45"
    ];
    let rigIndex = 0;
    
    // 初始化清單 1~54
    let items = Array.from({length: 54}, (_, i) => ({
        name: (i + 1).toString(),
        striked: false
    }));
    
    let isSpinning = false;
    let currentRotation = 0;
    let currentWinner = null;
    
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const listContainer = document.getElementById('names-show');
    const banner = document.getElementById('banner');
    const bannerText = document.getElementById('banner-text');
    const hideBtn = document.getElementById('hide-result');
    const closeBtn = document.getElementById('close-banner');
    const titleH1 = document.getElementById('main-title');
    const plsClick = document.getElementById('pls-click');

    // 官方配色陣列
    const colors = ['#4772ed', '#f46a6a', '#69d98a', '#f9dfa2', '#c895df'];

    // 渲染右側的文字方框
    function renderList() {
        listContainer.innerHTML = '';
        items.forEach(item => {
            const div = document.createElement('div');
            div.textContent = item.name;
            if (item.striked) div.classList.add('strike');
            listContainer.appendChild(div);
        });
    }

    // 繪製輪盤
    function drawWheel() {
        const activeItems = items.filter(i => !i.striked);
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2, cy = h / 2;
        const r = w / 2 - 2;
        const numSegments = activeItems.length;
        
        ctx.clearRect(0, 0, w, h);
        if(numSegments === 0) return;

        const anglePerSegment = 2 * Math.PI / numSegments;

        for(let i = 0; i < numSegments; i++) {
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, i * anglePerSegment, (i + 1) * anglePerSegment);
            const originalIndex = items.findIndex(item => item.name === activeItems[i].name);
            ctx.fillStyle = colors[originalIndex % colors.length];
            ctx.fill();
            ctx.lineWidth = 1;
            ctx.strokeStyle = "rgba(255,255,255,0.7)";
            ctx.stroke();

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(i * anglePerSegment + anglePerSegment / 2);
            ctx.textAlign = "right";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "#000";
            
            let fontSize = numSegments > 30 ? 15 : 24;
            ctx.font = `normal ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif`;
            ctx.fillText(activeItems[i].name, r - 25, 0);
            ctx.restore();
        }
    }

    function spinWheel() {
        const activeItems = items.filter(i => !i.striked);
        if (isSpinning || activeItems.length === 0) return;
        isSpinning = true;
        
        // 恢復正常開獎模式的橫幅狀態與按鈕顯示
        banner.style.display = 'none';
        hideBtn.style.display = 'inline-block';
        
        document.getElementById('header').classList.remove('show-banner');
        titleH1.style.display = 'block';
        plsClick.style.display = 'none';

        let targetName = riggedSequence[rigIndex];
        let targetIdx = activeItems.findIndex(i => i.name === targetName);
        
        if (targetIdx === -1) {
            targetIdx = Math.floor(Math.random() * activeItems.length);
            targetName = activeItems[targetIdx].name;
        } else {
            rigIndex++;
        }
        
        currentWinner = items.find(i => i.name === targetName);

        const anglePerSegment = 360 / activeItems.length;
        const targetSegmentAngle = targetIdx * anglePerSegment + (anglePerSegment / 2);
        const currentAngleMod = currentRotation % 360;
        
        const rotationAmount = (360 * 10) + (360 - targetSegmentAngle) - currentAngleMod;
        currentRotation += rotationAmount;

        canvas.style.transition = 'transform 4s cubic-bezier(0.1, 0.7, 0.1, 1)';
        canvas.style.transform = `rotate(${currentRotation}deg)`;

        setTimeout(() => {
            isSpinning = false;
            titleH1.style.display = 'none';
            bannerText.innerHTML = currentWinner.name;
            
            const originalIndex = items.findIndex(item => item.name === currentWinner.name);
            banner.style.backgroundColor = colors[originalIndex % colors.length];
            
            document.getElementById('header').classList.add('show-banner');
            banner.style.display = 'block';
        }, 4100);
    }

    document.querySelectorAll('.spin-btn').forEach(btn => btn.addEventListener('click', spinWheel));
    document.getElementById('wheel-wrapper').addEventListener('mousedown', spinWheel);
    
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.keyCode === 32) {
            e.preventDefault();
            spinWheel();
        }
        if (e.code === 'KeyX' || e.key === 'x' || e.key === 'X') {
            closeBtn.click();
        }
        if (e.code === 'KeyS' || e.key === 's' || e.key === 'S') {
            hideBtn.click();
        }
        if (e.code === 'KeyR' || e.key === 'r' || e.key === 'R') {
            document.querySelector('.reset-btn').click();
        }
    });

    // 處理點擊隱藏按鈕 (只隱藏 S 按鈕，X 原本就在左邊)
    hideBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (currentWinner && !currentWinner.striked) {
            currentWinner.striked = true;
            
            // 橫幅文字變成 "X 已被隱藏"
            bannerText.innerHTML = `${currentWinner.name} 已被隱藏`;
            hideBtn.style.display = 'none';
            
            renderList();
            drawWheel();
        }
    });

    closeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        banner.style.display = 'none';
        document.getElementById('header').classList.remove('show-banner');
        titleH1.style.display = 'block';
    });

    document.querySelectorAll('.reset-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            if(confirm("您確定要重設嗎？")) {
                items.forEach(item => item.striked = false);
                renderList();
                drawWheel();
                banner.style.display = 'none';
                document.getElementById('header').classList.remove('show-banner');
                titleH1.style.display = 'block';
                plsClick.style.display = 'block';
            }
        });
    });

    renderList();
    drawWheel();
})();
</script>
</body>
</html>
